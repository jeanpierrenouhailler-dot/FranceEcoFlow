version: '3.8'

services:
  app:
    build: .
    container_name: france_flow_explorer_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://flowuser:flowpass@postgres:5432/flowdb
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    container_name: france_flow_explorer_postgres
    environment:
      - POSTGRES_USER=flowuser
      - POSTGRES_PASSWORD=flowpass
      - POSTGRES_DB=flowdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  pgdata:
